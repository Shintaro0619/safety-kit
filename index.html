<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Japan Travel Safety Kit</title>
<meta name="description" content="Three things to sort out before a trip to Japan: an app for official disaster warnings in English, a data connection so they reach you, and travel insurance.">
<link rel="canonical" href="https://shintaro0619.github.io/safety-kit/">
<meta name="impact-site-verification" value="23deb23a-d9ad-460f-949f-e5f5d9cf8114">
<meta name="theme-color" content="#0F1420">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Japan Disaster Guide">
<meta property="og:title" content="Japan Travel Safety Kit">
<meta property="og:description" content="Everything you need for a safer trip to Japan: warnings app, eSIM, travel insurance.">
<meta property="og:url" content="https://shintaro0619.github.io/safety-kit/">
<meta property="og:image" content="https://shintaro0619.github.io/safety-kit/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Japan Travel Safety Kit">
<meta name="twitter:description" content="Everything you need for a safer trip to Japan: warnings app, eSIM, travel insurance.">
<meta name="twitter:image" content="https://shintaro0619.github.io/safety-kit/assets/og.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/jdg-logo-64.png">
<link rel="apple-touch-icon" href="assets/jdg-logo-192.png">
<style>
  :root {
    --bg: #0F1420;
    --bg-2: #1A2130;
    --bg-3: #232C3D;
    --line: #2E3950;
    --text: #F5F7FA;
    --muted: #9AA6BB;
    --accent: #2F6FED;
    --accent-2: #3B9EF5;
    --ok: #33B27B;
    --radius: 16px;
    --pad: 20px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  a { color: var(--accent-2); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 var(--pad) 48px; }

  /* hero */
  .hero { padding: 36px 0 28px; position: relative; }
  .hero::before {
    content: ""; position: absolute; inset: -40px -20px 0;
    background:
      linear-gradient(var(--bg) 0, transparent 40%, transparent 60%, var(--bg) 100%),
      repeating-linear-gradient(0deg, transparent 0 39px, var(--bg-2) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, var(--bg-2) 39px 40px);
    opacity: .7; z-index: -1; pointer-events: none;
  }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
  .brand img { width: 28px; height: 28px; border-radius: 7px; }
  h1 { font-size: 34px; line-height: 1.15; margin: 14px 0 8px; letter-spacing: -.01em; }
  h1 span { color: var(--accent-2); }
  .sub { font-size: 18px; color: var(--text); margin: 0 0 10px; }
  .intro { color: var(--muted); margin: 0 0 22px; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 52px; padding: 14px 18px;
    border-radius: 12px; border: 1px solid transparent;
    font-weight: 600; font-size: 16px; text-decoration: none;
    color: #fff; background: var(--accent);
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: translateY(1px); }
  .btn.secondary { background: var(--bg-3); border-color: var(--line); color: var(--text); }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--text); font-weight: 500; }
  .btn svg { width: 18px; height: 18px; flex: none; }

  /* cards */
  .card {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px var(--pad); margin: 16px 0;
  }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .num { color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .num b { color: var(--accent-2); font-weight: 700; }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.free { color: var(--ok); border-color: rgba(51,178,123,.4); }
  .card h2 { font-size: 22px; line-height: 1.25; margin: 8px 0 6px; }
  .why { color: var(--muted); margin: 0 0 12px; }
  ul.facts { margin: 0 0 14px; padding: 0; list-style: none; }
  ul.facts li { position: relative; padding-left: 18px; margin: 6px 0; color: var(--text); font-size: 15px; }
  ul.facts li::before { content: ""; position: absolute; left: 0; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .option { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
  .option h3 { font-size: 16px; margin: 0 0 6px; }
  .option ul.facts li { color: var(--muted); }
  .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .disc { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

  /* sections */
  .section { padding: 22px 0 0; }
  .section h2 { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .section p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .support { border: 1px dashed var(--line); border-radius: var(--radius); padding: 18px var(--pad); margin-top: 24px; }
  .support h2 { color: var(--text); text-transform: none; letter-spacing: 0; font-size: 17px; }
  footer { margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  footer p { margin: 6px 0; }
  footer a { color: var(--muted); }
  .hidden { display: none !important; }
  noscript p { background: var(--bg-3); padding: 12px; border-radius: 10px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="brand"><img src="assets/jdg-logo-64.png" alt="" width="28" height="28"><span id="eyebrow">By Japan Disaster Guide</span></div>
    <h1>Japan Travel <span>Safety Kit</span></h1>
    <p class="sub" id="subtitle">Everything you need for a safer trip to Japan.</p>
    <p class="intro" id="intro"></p>
    <a class="btn" id="hero-cta" href="https://apps.apple.com/app/japan-disaster-guide/id6787623258" data-event="click_appstore" data-vendor="hero" rel="noopener" target="_blank">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v14"/><path d="m6 10 6 6 6-6"/><path d="M4 20h16"/></svg>
      <span id="hero-cta-text">Get the Japan Disaster Guide</span>
    </a>
    <p class="note" style="text-align:center">Free on the App Store</p>
  </header>

  <noscript><p>This page needs JavaScript to show the links. The app is on the App Store at apps.apple.com/app/id6787623258.</p></noscript>

  <main id="cards"></main>

  <section class="section" id="disclosure">
    <h2>Affiliate disclosure</h2>
    <p id="disclosure-text"></p>
  </section>

  <section class="support" id="support">
    <h2 id="support-title">Support</h2>
    <p id="support-text"></p>
    <a class="btn ghost" id="support-cta" href="#" data-event="click_coffee" data-vendor="bmc" rel="noopener" target="_blank">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><path d="M6 2v2"/><path d="M10 2v2"/><path d="M14 2v2"/></svg>
      <span id="support-cta-text">Buy me a coffee</span>
    </a>
  </section>

  <footer>
    <p id="footer-line"></p>
    <p id="footer-analytics"></p>
    <p>
      <a id="link-instagram" href="https://www.instagram.com/japandisasterchannel/" data-event="click_other" data-vendor="instagram" rel="noopener" target="_blank">@japandisasterchannel</a>
      &nbsp;·&nbsp;
      <a id="link-privacy" href="https://shintaro0619.github.io/jdg-web/privacy.html" data-event="click_other" data-vendor="privacy" rel="noopener" target="_blank">Privacy</a>
    </p>
  </footer>
</div>

<script>
(function () {
  'use strict';

  // ---- UTM from the landing URL (kept on every event) ----
  var params = new URLSearchParams(location.search);
  var utm = {};
  ['utm_source', 'utm_medium', 'utm_campaign'].forEach(function (k) {
    var v = params.get(k);
    if (v) utm[k] = v.slice(0, 64);
  });

  // ---- tracking: Umami if configured, console otherwise ----
  var analyticsOn = false;
  function track(name, data) {
    var payload = Object.assign({}, utm, data || {});
    if (analyticsOn && window.umami && typeof window.umami.track === 'function') {
      try { window.umami.track(name, payload); } catch (e) { /* ignore */ }
    } else {
      try { console.log('[kit-track]', name, JSON.stringify(payload)); } catch (e) { /* ignore */ }
    }
    window.__kitEvents = window.__kitEvents || [];
    window.__kitEvents.push({ name: name, data: payload });
  }
  // In-app browsers (Instagram, Facebook, LINE, TikTok) have no tabs: a target="_blank"
  // link opens in a fresh context and the back button cannot return to this page.
  // There we navigate in the same view instead, after giving the tracker a moment.
  var inApp = /Instagram|FBAN|FBAV|FB_IAB|Line\/|BytedanceWebview|TikTok/i.test(navigator.userAgent)
    || params.get('inapp') === '1';
  if (inApp) {
    Array.prototype.forEach.call(document.querySelectorAll('a[target="_blank"]'), function (a) { a.removeAttribute('target'); });
  }
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest && ev.target.closest('a[data-event]');
    if (!a) return;
    track(a.getAttribute('data-event'), { vendor: a.getAttribute('data-vendor') || '' });
    if (inApp && a.href && a.getAttribute('href') !== '#') {
      ev.preventDefault();
      var href = a.href;
      setTimeout(function () { window.location.assign(href); }, 150);
    }
  });

  function loadAnalytics(cfg) {
    if (!cfg || !cfg.websiteId) return;
    var s = document.createElement('script');
    s.defer = true;
    s.src = cfg.scriptUrl || 'https://cloud.umami.is/script.js';
    s.setAttribute('data-website-id', cfg.websiteId);
    s.setAttribute('data-auto-track', 'true');
    document.head.appendChild(s);
    analyticsOn = true;
  }

  // ---- helpers ----
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function factsList(items, cls) {
    var ul = el('ul', 'facts' + (cls ? ' ' + cls : ''));
    (items || []).forEach(function (t) { ul.appendChild(el('li', null, t)); });
    return ul;
  }
  function appStoreUrl(cfg) {
    var base = cfg.appStore && cfg.appStore.url;
    var c = cfg.appStore && cfg.appStore.campaign;
    if (!base) return 'https://apps.apple.com/app/id6787623258';
    if (c && c.pt) {
      var q = new URLSearchParams({ pt: c.pt, ct: c.ct || 'safety_kit', mt: c.mt || '8' });
      return base + (base.indexOf('?') > -1 ? '&' : '?') + q.toString();
    }
    return base;
  }
  function resolveUrl(url, cfg) {
    if (url === 'APP_STORE') return appStoreUrl(cfg);
    return url;
  }
  function eventFor(cardId) {
    return { alerts: 'click_appstore', esim: 'click_esim', power: 'click_power', insurance: 'click_insurance' }[cardId] || 'click_other';
  }

  // ---- render ----
  function render(cfg) {
    var hero = cfg.hero || {};
    if (hero.eyebrow) document.getElementById('eyebrow').textContent = hero.eyebrow;
    if (hero.subtitle) document.getElementById('subtitle').textContent = hero.subtitle;
    document.getElementById('intro').textContent = hero.intro || '';
    if (hero.cta) document.getElementById('hero-cta-text').textContent = hero.cta;
    document.getElementById('hero-cta').href = appStoreUrl(cfg);

    var mount = document.getElementById('cards');
    mount.textContent = '';
    var shown = 0; // numbering follows the visible order, so hidden cards leave no gap
    (cfg.cards || []).forEach(function (card) {
      var options = (card.options || []).filter(function (o) { return o.enabled && o.url; });
      if (!options.length) return; // never show a dead button
      shown += 1;

      var sec = el('section', 'card');
      sec.id = 'card-' + card.id;
      var head = el('div', 'card-head');
      var num = el('div', 'num');
      num.appendChild(el('b', null, 'Essential ' + (shown < 10 ? '0' + shown : String(shown))));
      num.appendChild(document.createTextNode('  ' + (card.kicker || '')));
      head.appendChild(num);
      if (card.badge) head.appendChild(el('span', 'badge' + (card.kind === 'own' ? ' free' : ''), card.badge));
      sec.appendChild(head);
      sec.appendChild(el('h2', null, card.title || ''));
      if (card.why) sec.appendChild(el('p', 'why', card.why));
      if (card.facts && card.facts.length) sec.appendChild(factsList(card.facts));

      options.forEach(function (o, i) {
        var box = el('div', options.length > 1 || card.kind !== 'own' ? 'option' : '');
        if (options.length > 1 || card.kind !== 'own') box.appendChild(el('h3', null, o.name || ''));
        if (o.facts && o.facts.length) box.appendChild(factsList(o.facts));
        var a = el('a', 'btn' + (card.kind === 'own' ? '' : ' secondary'), o.cta || o.name || 'Open');
        a.href = resolveUrl(o.url, cfg);
        if (!inApp) a.target = '_blank';
        a.rel = card.kind === 'affiliate' ? 'sponsored noopener' : 'noopener';
        a.setAttribute('data-event', eventFor(card.id));
        a.setAttribute('data-vendor', o.id || String(i));
        box.appendChild(a);
        if (o.note) box.appendChild(el('p', 'note', o.note));
        if (card.kind === 'affiliate' && cfg.disclosure && cfg.disclosure.short) {
          box.appendChild(el('p', 'disc', cfg.disclosure.short));
        }
        sec.appendChild(box);
      });
      mount.appendChild(sec);
    });

    // Disclosure is shown only when at least one partner link is on the page.
    var d = cfg.disclosure || {};
    var hasAffiliate = !!mount.querySelector('a[rel~="sponsored"]');
    document.getElementById('disclosure-text').textContent = d.full || '';
    document.getElementById('disclosure').classList.toggle('hidden', !(d.full && hasAffiliate));

    var s = cfg.support || {};
    if (s.enabled && s.url) {
      document.getElementById('support-title').textContent = s.title || 'Support';
      document.getElementById('support-text').textContent = s.text || '';
      document.getElementById('support-cta').href = s.url;
      if (s.cta) document.getElementById('support-cta-text').textContent = s.cta;
    } else {
      document.getElementById('support').classList.add('hidden');
    }

    var f = cfg.footer || {};
    document.getElementById('footer-line').textContent = f.line || '';
    document.getElementById('footer-analytics').textContent = (cfg.analytics && cfg.analytics.websiteId) ? (f.analyticsNote || '') : '';
    if (cfg.site) {
      if (cfg.site.instagram) document.getElementById('link-instagram').href = cfg.site.instagram;
      if (cfg.site.privacyUrl) document.getElementById('link-privacy').href = cfg.site.privacyUrl;
    }
  }

  fetch('kit.config.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('config ' + r.status); return r.json(); })
    .then(function (cfg) { loadAnalytics(cfg.analytics); render(cfg); window.__kitConfig = cfg; })
    .catch(function (e) {
      console.error('[kit] config failed', e);
      // Hero CTA still works: the App Store URL is in the HTML.
    });
})();
</script>
</body>
</html>
